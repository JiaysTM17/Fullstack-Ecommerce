<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fullstack E-Commerce - Sàn thương mại điện tử đa người bán thông minh, tích hợp đầy đủ nghiệp vụ Enterprise."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Fullstack E-Commerce - Sàn Thương Mại Điện Tử Thông Minh</title>
  </head>
  <body>
    <noscript>
      <div style="font-family: sans-serif; padding: 30px; text-align: center; color: #dc2626;">
        Trang web yêu cầu bật JavaScript để tiếp tục.
      </div>
    </noscript>
    <div id="root"></div>
    <script>
      // Hướng dẫn thông minh nếu người dùng mở file trực tiếp (file://) hoặc cổng không phải Vite
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root && !root.children.length) {
            root.innerHTML = '<div style="font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 80px auto; padding: 32px; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center;">' +
              '<div style="width: 52px; height: 52px; border-radius: 50%; background: #fff7ed; color: #ea580c; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 26px;">⚠️</div>' +
              '<h2 style="font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 10px;">Không thể mở trực tiếp từ tệp file://</h2>' +
              '<p style="color: #64748b; font-size: 14px; line-height: 1.6; margin: 0 0 20px;">Dự án chạy bằng React + Vite hiện đại. Bạn hãy mở trình duyệt và truy cập địa chỉ bên dưới:</p>' +
              '<a href="http://localhost:5173" style="display: inline-block; background: linear-gradient(135deg, #ee4d2d, #ff6633); color: #ffffff; text-decoration: none; font-weight: 600; padding: 12px 24px; border-radius: 8px; font-size: 15px;">👉 Mở http://localhost:5173</a>' +
              '</div>';
          }
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
