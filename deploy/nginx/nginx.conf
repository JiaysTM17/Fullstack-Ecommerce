# ==============================================================================
# Enterprise Nginx Configuration for Mini Shopee Multi-Vendor Platform
# Architecture: Reverse Proxy, Load Balancer, SSL Termination, Layer 7 Rate Limiter
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Performance Logging with Request Latency
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer Overflow Protection
    client_body_buffer_size 128k;
    client_max_body_size 20m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Gzip Compression Suite
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Edge Rate-Limiting Zones (Layer 7 Anti-DDoS)
    # 1. API general rate limit zone: 20 requests/sec per IP with burst=40
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=20r/s;

    # 2. Flash Sale Checkout rate limit zone: 5 requests/sec per IP with burst=10
    limit_req_zone $binary_remote_addr zone=flash_sale_checkout_limit:10m rate=5r/s;

    # 3. Connection limit: max 30 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # Upstream Node.js Backend Cluster (Round-robin / Least Connections)
    upstream backend_cluster {
        least_conn;
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s backup;
        keepalive 64;
    }

    # Upstream Vite Frontend Static / SSR Cluster
    upstream frontend_cluster {
        server 127.0.0.1:5173;
        keepalive 32;
    }

    # HTTP to HTTPS Global Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name minishopee.local www.minishopee.local;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Production Gateway
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name minishopee.local www.minishopee.local;

        # SSL Certificates & Modern Ciphers (Mozilla Intermediate)
        ssl_certificate /etc/nginx/ssl/live/minishopee.local/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/minishopee.local/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Enterprise Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

        # Rate Limiting & Concurrency enforcement
        limit_conn addr_conn_limit 30;

        # API Endpoints Routing & Edge Protection
        location /api/ {
            limit_req zone=api_general_limit burst=40 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Upstream timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Sensitive Flash Sale Checkout Protection
        location /api/orders {
            limit_req zone=flash_sale_checkout_limit burst=10 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Chat & Real-Time Logistics Stepper
        location /socket.io/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # Static Assets Caching (Vite build dist)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf)$ {
            root /var/www/ecommerce/client/dist;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
            try_files $uri @frontend;
        }

        # Single-Page-Application (SPA) HTML Fallback
        location / {
            root /var/www/ecommerce/client/dist;
            try_files $uri $uri/ /index.html @frontend;
        }

        location @frontend {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
        }

        # Health Check Endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
