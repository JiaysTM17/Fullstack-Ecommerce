version: "3.8"

services:
  # Backend API Service
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mini-shopee-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/mini-shopee
      - CLIENT_URL=http://localhost:5173,http://localhost:3000
      - JWT_SECRET=mini-shopee-docker-jwt-secret-key-2026-production
      - JWT_EXPIRES_IN=7d
      - LOG_LEVEL=INFO
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - api-data:/app/data
    networks:
      - shopee-network

  # MongoDB Database Service
  mongo:
    image: mongo:7.0-jammy
    container_name: mini-shopee-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=mini-shopee
    volumes:
      - mongo-data:/data/db
    networks:
      - shopee-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  api-data:
    driver: local
  mongo-data:
    driver: local

networks:
  shopee-network:
    driver: bridge
